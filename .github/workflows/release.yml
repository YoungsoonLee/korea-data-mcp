name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # authenticate to the MCP Registry with OIDC

env:
  MCP_PUBLISHER_VERSION: v1.8.6

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changelog needs the full history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # MCP Bundle: one-click install in Claude Desktop, and the package the
      # MCP Registry lists.
      - name: Build MCP Bundle
        run: mcpb/build.sh "${GITHUB_REF_NAME#v}"
      - name: Upload MCP Bundle
        run: gh release upload "$GITHUB_REF_NAME" dist/korea-data-mcp.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the MCP Registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum dist/korea-data-mcp.mcpb | cut -d' ' -f1)
          jq --arg v "$version" --arg tag "$GITHUB_REF_NAME" --arg sha "$sha" '
            .version = $v
            | .packages[0].version = $v
            | .packages[0].identifier = "https://github.com/YoungsoonLee/korea-data-mcp/releases/download/\($tag)/korea-data-mcp.mcpb"
            | .packages[0].fileSha256 = $sha' server.json > server.release.json
          mv server.release.json server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
