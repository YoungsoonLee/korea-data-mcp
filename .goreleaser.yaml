version: 2
project_name: korea-data-mcp

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: korea-data-mcp
    main: ./cmd/korea-data-mcp
    binary: korea-data-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}

# A macOS universal binary for the MCP Bundle (mcpb/build.sh); the archives
# keep one binary per architecture.
universal_binaries:
  - id: korea-data-mcp-darwin
    ids: [korea-data-mcp]

archives:
  - ids: [korea-data-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}" # no version, so releases/latest/download/ links stay stable
    files:
      - LICENSE
      - README.md
      - README.ko.md
      - .env.example

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
